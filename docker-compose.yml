name: pulse-fx

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsefx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsefx}
      POSTGRES_DB: ${POSTGRES_DB:-pulsefx}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pulsefx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pulsefx} -d ${POSTGRES_DB:-pulsefx}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - pulsefx_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # UI web pra inspecionar o Redis (chaves da fila BullMQ etc.) — não sobe
  # com `docker compose up` normal, só sob demanda:
  #   docker compose up -d redis-commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    profiles: ['tools']
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '${REDIS_COMMANDER_PORT:-8081}:8081'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsefx}:${POSTGRES_PASSWORD:-pulsefx}@postgres:5432/${POSTGRES_DB:-pulsefx}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Sem valor padrão de propósito: a API deve recusar subir sem um
      # segredo real configurado (ver .env.example).
      API_TOKEN: ${API_TOKEN:?defina API_TOKEN no .env — veja .env.example}
      # Opcional: só necessária se algum indicador usar source "fred".
      FRED_API_KEY: ${FRED_API_KEY:-}
    ports:
      - '${API_PORT:-3333}:3333'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
        VITE_API_TOKEN: ${API_TOKEN:?defina API_TOKEN no .env — veja .env.example}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-5173}:80'

volumes:
  pulsefx_postgres_data:
  pulsefx_redis_data:
